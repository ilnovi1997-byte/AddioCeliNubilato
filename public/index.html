<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addio al Celibato - Accesso</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="center-screen">
    <div class="card">
        <h1>Addio al Celibato 🎉</h1>
        <p>Inserisci il tuo nome e un PIN per accedere o registrarti.</p>
        <form id="loginForm">
            <input type="text" id="name" placeholder="Il tuo Nome / Soprannome" required>
            <input type="password" id="pin" placeholder="PIN a 4 cifre" maxlength="4" required>
            <button type="submit">Entra nel Gruppo</button>
        </form>
    </div>
    <script src="/js/auth.js"></script>
</body>
</html>
