<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bachelor Hub 🎉</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="app-body">
    <header class="app-header">
        <div class="user-info">
            <span class="user-avatar" id="avatarIcon">😎</span>
            <div>
                <strong id="userName">Ospite</strong>
                <span class="user-badge" id="userRole">Membro</span>
            </div>
        </div>
        <div class="score-display">
            <span class="score-num" id="myPoints">0</span>
            <span class="score-label">Punti</span>
        </div>
    </header>

    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('tasks')">
            <span>🎯</span>
            <small>Sfide</small>
        </button>
        <button class="nav-item" onclick="switchTab('ranking')">
            <span>🏆</span>
            <small>Classifica</small>
        </button>
        <button class="nav-item" onclick="switchTab('feed')">
            <span>💬</span>
            <small>Live Feed</small>
        </button>
        <button class="nav-item" onclick="logout()">
            <span>🚪</span>
            <small>Esci</small>
        </button>
    </nav>

    <main class="app-container">
        <section id="tab-tasks" class="tab-panel active">
            <div class="section-title">
                <h2>Sfide & Penitenze</h2>
                <p>Completa le prove per guadagnare punti e scalare la classifica!</p>
            </div>
            <div id="taskList" class="task-list"></div>
        </section>

        <section id="tab-ranking" class="tab-panel">
            <div class="section-title">
                <h2>Classifica Live</h2>
                <p>Chi sarà il vero MVP della serata?</p>
            </div>
            <div id="rankingList" class="ranking-list"></div>
        </section>

        <section id="tab-feed" class="tab-panel">
            <div class="section-title">
                <h2>Bacheca Live</h2>
                <p>Condividi aggiornamenti in tempo reale con tutto il gruppo.</p>
            </div>
            <div class="feed-input-box">
                <input type="text" id="feedInput" placeholder="Cosa sta succedendo?..." maxlength="150">
                <button id="feedSendBtn" class="btn-send">Invia</button>
            </div>
            <div id="feedList" class="feed-list"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
