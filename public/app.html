<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clash Dashboard ⚔️</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body class="app-body">
    <!-- Header Utente -->
    <header class="app-header">
        <div class="user-info">
            <span class="user-avatar" id="avatarIcon">😎</span>
            <div>
                <strong id="userName">Ospite</strong>
                <span class="user-badge" id="userTeamBadge">Nessuna Squadra</span>
            </div>
        </div>
        <div class="score-display">
            <span class="score-num" id="myPoints">0</span>
            <span class="score-label">Miei Pt</span>
        </div>
    </header>

    <!-- Barra Scontro Squadre -->
    <section class="clash-banner">
        <div class="clash-team nubilers">
            <span>💖 NUBILERS</span>
            <strong id="nubilersPoints">0 pt</strong>
        </div>
        <div class="clash-vs">VS</div>
        <div class="clash-team celibers">
            <span>💙 CELIBERS</span>
            <strong id="celibersPoints">0 pt</strong>
        </div>
    </section>

    <!-- Nav Tabs -->
    <nav class="nav-bar">
        <button class="nav-item active" onclick="switchTab('tasks')">
            <span>🎯</span>
            <small>Sfide</small>
        </button>
        <button class="nav-item" onclick="switchTab('ranking')">
            <span>🏆</span>
            <small>Classifica</small>
        </button>
        <button class="nav-item" onclick="switchTab('feed')">
            <span>💬</span>
            <small>Feed</small>
        </button>
        <button class="nav-item" id="adminTabBtn" style="display: none;" onclick="switchTab('admin')">
            <span>⚙️</span>
            <small>Admin</small>
        </button>
        <button class="nav-item" onclick="logout()">
            <span>🚪</span>
            <small>Esci</small>
        </button>
    </nav>

    <main class="app-container">
        <!-- Tab Sfide -->
        <section id="tab-tasks" class="tab-panel active">
            <div class="section-title">
                <h2>Sfide Ripetibili</h2>
                <p>Ogni volta che completi una sfida guadagni punti per la tua squadra!</p>
            </div>
            <div id="taskList" class="task-list"></div>
        </section>

        <!-- Tab Classifica -->
        <section id="tab-ranking" class="tab-panel">
            <div class="section-title">
                <h2>Top Contributors</h2>
                <p>Classifica individuale per squadra</p>
            </div>
            <div id="rankingList" class="ranking-list"></div>
        </section>

        <!-- Tab Feed -->
        <section id="tab-feed" class="tab-panel">
            <div class="section-title">
                <h2>Live Event Feed</h2>
            </div>
            <div class="feed-input-box">
                <input type="text" id="feedInput" placeholder="Messaggio o provocazione..." maxlength="140">
                <button id="feedSendBtn" class="btn-send">Invia</button>
            </div>
            <div id="feedList" class="feed-list"></div>
        </section>

        <!-- Tab Admin -->
        <section id="tab-admin" class="tab-panel">
            <div class="section-title">
                <h2>Pannello Admin ⚙️</h2>
            </div>
            <div class="admin-card">
                <h3>➕ Crea Nuova Sfida</h3>
                <input type="text" id="newTaskTitle" placeholder="Testo della sfida">
                <input type="number" id="newTaskPoints" placeholder="Punti" value="50">
                <button class="btn-primary" onclick="adminCreateTask()">Aggiungi Sfida</button>
            </div>
            <div class="admin-card">
                <h3>⭐ Bonus / Malus Squadra</h3>
                <select id="adminTeamSelect">
                    <option value="Nubilers">Nubilers</option>
                    <option value="Celibers">Celibers</option>
                </select>
                <input type="number" id="adminTeamPoints" placeholder="Punti (+50 o -50)">
                <button class="btn-primary" onclick="adminGiveTeamPoints()">Assegna</button>
            </div>
        </section>
    </main>

    <script src="/js/app.js"></script>
</body>
</html>
